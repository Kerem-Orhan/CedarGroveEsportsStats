<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cedar Grove Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: header bar (school name left, game tabs right) above a "Recent" grid of match cards; add/edit happens in a dialog */
:root{
  --bg:#f2f4f1; --card:#ffffff; --ink:#16201b; --muted:#5e6b64; --line:#dde3de;
  --brand:#1f5c3f; --brand-ink:#ffffff;
  --win:#1d8a4e; --loss:#c43a31; --draw:#9a7d1c;
  --smash:#d6332a; --smash-2:#f2a12c;
  --sf:#2446a6; --sf-2:#f5c518;
  --other:#4b5563; --other-2:#9ca3af;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --card:#18201b; --ink:#e9efeb; --muted:#9aa8a0; --line:#2a352f;
  --brand:#2f8a5f; --brand-ink:#ffffff; --win:#43c47e; --loss:#ff6b61; --draw:#e0c050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --card:#18201b; --ink:#e9efeb; --muted:#9aa8a0; --line:#2a352f;
  --brand:#2f8a5f; --brand-ink:#ffffff; --win:#43c47e; --loss:#ff6b61; --draw:#e0c050; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- header */
.top{background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:14px}
.school{display:flex;align-items:center;gap:12px;min-width:0}
.crest{width:42px;height:42px;flex:none;border-radius:8px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em}
.school h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase}
.school small{display:block;font-size:13px;opacity:.8;letter-spacing:.04em}
.games{display:flex;flex-wrap:wrap;gap:6px}
.games button{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:var(--brand-ink);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.games button:hover{border-color:var(--brand-ink)}
.games button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}

/* ---------- main */
main{padding-block:28px 56px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.head p{margin:4px 0 0;color:var(--muted)}
.head p b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:8px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--loss);border:1.5px solid var(--loss)}
.btn.danger.armed{background:var(--loss);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}

/* ---------- match card */
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .15s ease, box-shadow .15s ease}
.match:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.meta{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-size:13px;color:var(--muted)}
.gamepill{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:4px;padding:1px 8px}
.meta .date{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:14px 16px 6px}
.team{min-width:0}
.team.them{text-align:right}
.team .name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.team .player{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.score{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score .sep{color:var(--muted);margin:0 4px}
.score .lead{color:var(--ink)} .score .trail{color:var(--muted)}
.result{display:flex;justify-content:center;padding:0 16px 10px}
.result span{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor}
.result .W{color:var(--win)} .result .L{color:var(--loss)} .result .D{color:var(--draw)}
.notes{padding:0 16px 14px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* banner: matchup art */
.banner{margin-top:auto;position:relative;aspect-ratio:16/7;max-width:100%;overflow:hidden;color:#fff;display:flex;align-items:flex-end}
.banner .bg{position:absolute;inset:0;background:
  repeating-linear-gradient(-55deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px),
  linear-gradient(115deg, var(--g1) 0 50%, var(--g2) 50% 100%)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .shade{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0) 65%)}
.vsrow{position:relative;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;padding:12px 16px}
.vsrow .c{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.35);overflow-wrap:anywhere}
.vsrow .c.r{text-align:right}
.vsrow .vs{font-family:var(--display);font-weight:800;font-size:15px;background:rgba(0,0,0,.45);border-radius:4px;padding:2px 7px}
.vsrow .c small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;opacity:.85;margin-bottom:3px}

.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.empty h3{margin:0 0 6px;font-family:var(--display);font-size:24px;text-transform:uppercase;color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:22px}

footer{border-top:1px solid var(--line);padding-block:16px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
footer .links{display:flex;gap:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

/* ---------- dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.dlg{display:grid;gap:16px;padding:22px}
.dlg h3{margin:0;font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field span{font-size:13px;font-weight:600}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.scorein{display:flex;align-items:center;gap:10px}
.scorein input{width:5rem;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;padding:4px}
.scorein b{font-family:var(--display);font-size:22px;color:var(--muted)}
.group{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dlg-actions .spacer{flex:1}
.err{color:var(--loss);font-size:14px;min-height:1em}
@media (max-width:480px){ .fields{grid-template-columns:1fr} .score{font-size:36px} .school h1{font-size:20px} }
@media (prefers-reduced-motion: reduce){ .match{transition:none} .match:hover{transform:none} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="school">
      <div class="crest" aria-hidden="true">CG</div>
      <div><h1>Cedar Grove High School Esports</h1><small>Match results</small></div>
    </div>
    <nav class="games" aria-label="Filter by game" id="gameTabs">
      <button type="button" data-game="" aria-pressed="true">All</button>
      <button type="button" data-game="Smash Bros" aria-pressed="false">Smash Bros</button>
      <button type="button" data-game="Street Fighter" aria-pressed="false">Street Fighter</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h2>Recent</h2>
      <p id="record">&nbsp;</p>
    </div>
    <button class="btn" type="button" id="addBtn">+ Add match</button>
  </div>
  <div class="note" id="exampleNote" hidden><b>These are example matches.</b> They show how results look and disappear once you add your first real match.</div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn ghost" type="button" id="moreBtn" hidden>Show more</button></div>
</main>

<footer>
  <div class="wrap">
    <span>Matches are saved in this browser.</span>
    <div class="links">
      <button class="linkbtn" type="button" id="exportBtn">Export matches</button>
      <label class="linkbtn" for="importFile">Import matches</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</footer>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog" autocomplete="off">
    <h3 id="dlgTitle">Add match</h3>
    <div class="fields">
      <label class="field"><span>Game</span>
        <select id="fGame"><option>Smash Bros</option><option>Street Fighter</option></select>
      </label>
      <label class="field"><span>Date</span><input type="date" id="fDate" required></label>
      <label class="field"><span>Opponent</span><input id="fOpp" list="oppList" placeholder="e.g. Westfield High" required></label>
      <label class="field"><span>Event</span><input id="fEvent" list="eventList" placeholder="e.g. PlayVS Week 3"></label>
      <div class="field full"><span>Final score</span>
        <div class="scorein">
          <input type="number" id="fUs" min="0" inputmode="numeric" placeholder="Us" aria-label="Cedar Grove score" required>
          <b>:</b>
          <input type="number" id="fThem" min="0" inputmode="numeric" placeholder="Them" aria-label="Opponent score" required>
        </div>
        <small>Games won in the set, e.g. 2 : 3.</small>
      </div>

      <div class="group">Players</div>
      <label class="field"><span>Our player</span><input id="fPlayer" list="playerList" placeholder="Gamertag"></label>
      <label class="field"><span>Our character</span><input id="fChar" list="charList" placeholder="e.g. Fox"></label>
      <label class="field"><span>Their player</span><input id="fOppPlayer" placeholder="Gamertag"></label>
      <label class="field"><span>Their character</span><input id="fOppChar" list="charList" placeholder="e.g. Marth"></label>

      <div class="group">Extras</div>
      <label class="field full"><span>Picture link <small>(optional)</small></span><input id="fImg" type="url" placeholder="https://… screenshot or team photo"><small>Paste a link to an image. Without one, the card shows the character matchup.</small></label>
      <label class="field full"><span>Notes</span><textarea id="fNotes" rows="2" placeholder="Highlights, key moments…"></textarea></label>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="dlg-actions">
      <button class="btn danger" type="button" id="delBtn" hidden>Delete</button>
      <span class="spacer"></span>
      <button class="btn ghost" type="button" id="cancelBtn">Cancel</button>
      <button class="btn" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<datalist id="oppList"></datalist><datalist id="eventList"></datalist><datalist id="playerList"></datalist><datalist id="charList"></datalist>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const KEY = "cedargrove-matches-v2";
  const PAGE = 12;

  const GAMES = {
    "Smash Bros": {color:"var(--smash)", g1:"var(--smash)", g2:"var(--smash-2)",
      chars:["Mario","Donkey Kong","Link","Samus","Yoshi","Kirby","Fox","Pikachu","Luigi","Ness","Captain Falcon","Jigglypuff","Peach","Bowser","Ice Climbers","Sheik","Zelda","Pichu","Falco","Marth","Lucina","Young Link","Ganondorf","Mewtwo","Roy","Chrom","Mr. Game & Watch","Meta Knight","Pit","Zero Suit Samus","Wario","Snake","Ike","Pokémon Trainer","Diddy Kong","Lucas","Sonic","King Dedede","Olimar","Lucario","R.O.B.","Toon Link","Wolf","Villager","Mega Man","Wii Fit Trainer","Rosalina & Luma","Little Mac","Greninja","Palutena","Pac-Man","Robin","Shulk","Bowser Jr.","Duck Hunt","Ryu","Ken","Cloud","Corrin","Bayonetta","Inkling","Ridley","Simon","Richter","King K. Rool","Isabelle","Incineroar","Piranha Plant","Joker","Hero","Banjo & Kazooie","Terry","Byleth","Min Min","Steve","Sephiroth","Pyra & Mythra","Kazuya","Sora"]},
    "Street Fighter": {color:"var(--sf)", g1:"var(--sf)", g2:"var(--sf-2)",
      chars:["Ryu","Ken","Chun-Li","Guile","Luke","Jamie","Kimberly","Juri","Cammy","Dee Jay","Manon","Marisa","JP","Zangief","Lily","Dhalsim","E. Honda","Blanka","Rashid","A.K.I.","Ed","Akuma","M. Bison","Terry","Mai","Elena"]}
  };
  const gameInfo = g => GAMES[g] || {color:"var(--other)", g1:"var(--other)", g2:"var(--other-2)", chars:[]};

  // Shown only while no real matches exist. Never saved.
  const EXAMPLES = [
    {id:"ex1",game:"Smash Bros",date:"2026-10-14",opponent:"Westfield High",event:"PlayVS Week 4",us:2,them:3,player:"Kerem",char:"Fox",oppPlayer:"Blaze",oppChar:"Marth",notes:"Went to game 5. Lost last stock on Battlefield."},
    {id:"ex2",game:"Street Fighter",date:"2026-10-12",opponent:"Lakeview Academy",event:"Scrim",us:3,them:1,player:"Dani",char:"Ken",oppPlayer:"Vex",oppChar:"Juri",notes:"Drive Rush pressure won the set."},
    {id:"ex3",game:"Smash Bros",date:"2026-10-07",opponent:"North Ridge High",event:"PlayVS Week 3",us:3,them:0,player:"Kerem",char:"Fox",oppPlayer:"Tide",oppChar:"Pikachu",notes:""},
  ];

  let matches = [], filter = "", shown = PAGE, editingId = null, storageOK = true;

  function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; }catch(e){ storageOK = false; return []; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(matches)); return true; }catch(e){ return false; } }
  const resultOf = m => m.us > m.them ? "W" : m.us < m.them ? "L" : "D";
  const byDate = (a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0) - (a.createdAt||0);
  const fmtDate = d => { if(!d) return ""; const t = new Date(d+"T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
  const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const safeUrl = u => /^https:\/\/[^\s"'<>]+$/i.test(u||"") ? u : "";

  // ---------- render
  function card(m){
    const g = gameInfo(m.game), r = resultOf(m);
    const img = safeUrl(m.image);
    const usLead = m.us >= m.them;
    const label = r==="W" ? "Win" : r==="L" ? "Loss" : "Draw";
    return `<button type="button" class="match" data-id="${esc(m.id)}" aria-label="${esc(label)} against ${esc(m.opponent)}, ${m.us} to ${m.them}. Open to edit.">
      <div class="meta"><span class="gamepill" style="background:${g.color}">${esc(m.game)}</span><span>${esc(m.event||"")}</span><span class="date">${esc(fmtDate(m.date))}</span></div>
      <div class="scoreline">
        <div class="team"><div class="name">Cedar Grove</div>${m.player?`<div class="player">${esc(m.player)}</div>`:""}</div>
        <div class="score"><span class="${usLead?"lead":"trail"}">${m.us}</span><span class="sep">:</span><span class="${usLead&&m.us!==m.them?"trail":"lead"}">${m.them}</span></div>
        <div class="team them"><div class="name">${esc(m.opponent)}</div>${m.oppPlayer?`<div class="player">${esc(m.oppPlayer)}</div>`:""}</div>
      </div>
      <div class="result"><span class="${r}">${label}</span></div>
      ${m.notes?`<div class="notes">${esc(m.notes)}</div>`:""}
      <div class="banner" style="--g1:${g.g1};--g2:${g.g2}">
        <div class="bg"></div>
        ${img?`<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:""}
        <div class="shade"></div>
        <div class="vsrow">
          <div class="c"><small>Cedar Grove</small>${esc(m.char||"—")}</div>
          <span class="vs">VS</span>
          <div class="c r"><small>${esc(m.opponent)}</small>${esc(m.oppChar||"—")}</div>
        </div>
      </div>
    </button>`;
  }

  function render(){
    const examples = matches.length === 0;
    const src = (examples ? EXAMPLES : matches).filter(m => !filter || m.game === filter).sort(byDate);
    $("#exampleNote").hidden = !examples;

    const W = src.filter(m=>resultOf(m)==="W").length, L = src.filter(m=>resultOf(m)==="L").length;
    $("#record").innerHTML = src.length
      ? `${filter ? esc(filter) : "All games"} · <b>${W}–${L}</b> record${examples ? " (examples)" : ""}`
      : "&nbsp;";

    const grid = $("#grid");
    if (!src.length){
      grid.innerHTML = `<div class="empty"><h3>No ${esc(filter)} matches yet</h3><p>Add a match and it will show up here.</p></div>`;
    } else {
      grid.innerHTML = src.slice(0, shown).map(card).join("");
    }
    $("#moreBtn").hidden = src.length <= shown;
  }

  // ---------- tabs
  $("#gameTabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-game]"); if (!b) return;
    filter = b.dataset.game; shown = PAGE;
    for (const x of $("#gameTabs").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x===b));
    try{ localStorage.setItem(KEY+"-tab", filter); }catch(e){}
    render();
  });
  $("#moreBtn").addEventListener("click", () => { shown += PAGE; render(); });

  // ---------- dialog
  const dlg = $("#dlg");
  function fillLists(game){
    const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
    const opts = a => a.map(v=>`<option value="${esc(v)}">`).join("");
    $("#oppList").innerHTML = opts(uniq(matches.map(m=>m.opponent)));
    $("#eventList").innerHTML = opts(uniq(["Scrim","Friendly","PlayVS Regular Season","PlayVS Playoffs","Tournament", ...matches.map(m=>m.event)]));
    $("#playerList").innerHTML = opts(uniq(matches.map(m=>m.player)));
    $("#charList").innerHTML = opts(gameInfo(game).chars);
  }
  $("#fGame").addEventListener("change", () => fillLists($("#fGame").value));

  function openDialog(m){
    editingId = m ? m.id : null;
    const last = matches.slice().sort(byDate)[0];
    $("#dlgTitle").textContent = m ? "Edit match" : "Add match";
    $("#fGame").value = m?.game || filter || last?.game || "Smash Bros";
    $("#fDate").value = m?.date || today();
    $("#fOpp").value = m?.opponent || "";
    $("#fEvent").value = m?.event || "";
    $("#fUs").value = m ? m.us : "";
    $("#fThem").value = m ? m.them : "";
    $("#fPlayer").value = m?.player || "";
    $("#fChar").value = m?.char || "";
    $("#fOppPlayer").value = m?.oppPlayer || "";
    $("#fOppChar").value = m?.oppChar || "";
    $("#fImg").value = m?.image || "";
    $("#fNotes").value = m?.notes || "";
    $("#err").textContent = "";
    $("#delBtn").hidden = !m; disarm();
    fillLists($("#fGame").value);
    dlg.showModal();
    $("#fOpp").focus();
  }
  $("#addBtn").addEventListener("click", () => openDialog(null));
  $("#cancelBtn").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  $("#grid").addEventListener("click", e => {
    const c = e.target.closest(".match"); if (!c) return;
    const id = c.dataset.id;
    if (id.startsWith("ex")){ openDialog(null); const ex = EXAMPLES.find(x=>x.id===id); if (ex) $("#fGame").value = ex.game; fillLists(ex.game); return; }
    const m = matches.find(x=>x.id===id); if (m) openDialog(m);
  });

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const us = parseInt($("#fUs").value,10), them = parseInt($("#fThem").value,10);
    const opp = $("#fOpp").value.trim();
    const img = $("#fImg").value.trim();
    if (!opp){ $("#err").textContent = "Add the opponent's name."; return; }
    if (!Number.isFinite(us) || !Number.isFinite(them) || us < 0 || them < 0){ $("#err").textContent = "Enter both scores as whole numbers."; return; }
    if (img && !safeUrl(img)){ $("#err").textContent = "The picture link must start with https://"; return; }
    const prev = editingId && matches.find(m=>m.id===editingId);
    const rec = {
      id: editingId || "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      game: $("#fGame").value, date: $("#fDate").value || today(),
      opponent: opp.slice(0,60), event: $("#fEvent").value.trim().slice(0,60),
      us, them,
      player: $("#fPlayer").value.trim().slice(0,40), char: $("#fChar").value.trim().slice(0,40),
      oppPlayer: $("#fOppPlayer").value.trim().slice(0,40), oppChar: $("#fOppChar").value.trim().slice(0,40),
      image: img, notes: $("#fNotes").value.trim().slice(0,1000),
      createdAt: prev?.createdAt || Date.now(),
    };
    const before = matches;
    matches = editingId ? matches.map(m => m.id===editingId ? rec : m) : [...matches, rec];
    if (!save()){ matches = before; $("#err").textContent = "This browser blocked saving (private mode or blocked site data)."; return; }
    dlg.close(); render();
  });

  let armTimer;
  function disarm(){ const b = $("#delBtn"); b.classList.remove("armed"); b.textContent = "Delete"; clearTimeout(armTimer); }
  $("#delBtn").addEventListener("click", () => {
    const b = $("#delBtn");
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Click again to delete"; armTimer = setTimeout(disarm, 4000); return; }
    matches = matches.filter(m => m.id !== editingId); save(); dlg.close(); render();
  });

  // ---------- export / import
  $("#exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(matches.slice().sort(byDate), null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `cedar-grove-matches-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try{
      const data = JSON.parse(await f.text()); if (!Array.isArray(data)) throw 0;
      const map = new Map(matches.map(m=>[m.id,m]));
      const str = (v,n) => String(v ?? "").slice(0,n);
      for (const m of data){
        if (!m || !m.opponent || !Number.isFinite(+m.us) || !Number.isFinite(+m.them)) continue;
        const id = str(m.id,40) || "m" + Math.random().toString(36).slice(2,10);
        map.set(id, {id, game:str(m.game,40), date:str(m.date,10), opponent:str(m.opponent,60), event:str(m.event,60), us:+m.us, them:+m.them,
          player:str(m.player,40), char:str(m.char,40), oppPlayer:str(m.oppPlayer,40), oppChar:str(m.oppChar,40),
          image:safeUrl(m.image), notes:str(m.notes,1000), createdAt:+m.createdAt||0});
      }
      matches = [...map.values()]; save(); render();
    }catch(err){ /* not a valid export; ignore */ }
  });

  // ---------- boot
  matches = load();
  try{ const t = localStorage.getItem(KEY+"-tab"); if (t !== null && (t==="" || GAMES[t])){ filter = t; for (const x of $("#gameTabs").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x.dataset.game===t)); } }catch(e){}
  render();
})();
</script>
</body>
</html>
